version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development:test'
        EXECJS_RUNTIME: Disabled
        RAILS_ENV: 'production'
        RAILS_SERVE_STATIC_FILES: 'true'
    image: hub:latest
    env_file: .env ## Change this file for customized env variables
    volumes:
      - ${HUB_DIAGNOSTICS_DATA_PATH:-./volumes/test/diagnostics}:${HUB_DIAGNOSTICS_DIR:-/app/log/hub_diagnostics}

  rails:
    <<: *base
    image: hub:latest
    platform: linux/amd64
    depends_on:
      - postgres
      - redis
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - HUB_DIAGNOSTICS_ENABLED=${HUB_DIAGNOSTICS_ENABLED:-true}
      - HUB_CONNECT_RELIABILITY_ENABLED=${HUB_CONNECT_RELIABILITY_ENABLED:-true}
      - HUB_EXISTING_INSTANCE_BINDING_ENABLED=${HUB_EXISTING_INSTANCE_BINDING_ENABLED:-true}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    image: hub:latest
    platform: linux/amd64
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - HUB_DIAGNOSTICS_ENABLED=${HUB_DIAGNOSTICS_ENABLED:-true}
      - HUB_CONNECT_RELIABILITY_ENABLED=${HUB_CONNECT_RELIABILITY_ENABLED:-true}
      - HUB_EXISTING_INSTANCE_BINDING_ENABLED=${HUB_EXISTING_INSTANCE_BINDING_ENABLED:-true}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    platform: linux/amd64
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres:/data/postgres
    environment:
      - POSTGRES_DB=hub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=

  redis:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    platform: linux/amd64
    restart: always
    volumes:
      - redis:/data/redis
    ports:
      - '6379:6379'

volumes:
  postgres:
  redis:
  bundle:
  packs:
  node_modules_rails:
