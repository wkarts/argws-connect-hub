services:
  base:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.base
      args:
        HUB_DEVCONTAINER_IMAGE: ${HUB_DEVCONTAINER_IMAGE:-ghcr.io/wkarts/argws-connect-hub:develop}
    image: hub-dev-base:latest

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        HUB_DEVCONTAINER_IMAGE: ${HUB_DEVCONTAINER_IMAGE:-ghcr.io/wkarts/argws-connect-hub:develop}
    volumes:
      - ..:/workspace:cached
      - ../volumes/devcontainer/diagnostics:/workspace/log/hub_diagnostics
    environment:
      HUB_DIAGNOSTICS_ENABLED: ${HUB_DIAGNOSTICS_ENABLED:-true}
      HUB_DIAGNOSTICS_DIR: /workspace/log/hub_diagnostics
      HUB_CONNECT_RELIABILITY_ENABLED: ${HUB_CONNECT_RELIABILITY_ENABLED:-true}
      HUB_EXISTING_INSTANCE_BINDING_ENABLED: ${HUB_EXISTING_INSTANCE_BINDING_ENABLED:-true}
    command: sleep infinity
    network_mode: service:db

  db:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    restart: unless-stopped
    network_mode: service:db
    volumes:
      - redis-data:/data

  mailpit:
    image: ${HUB_MAIL_IMAGE:-ghcr.io/axllent/mailpit:latest}
    restart: unless-stopped
    network_mode: service:db

volumes:
  postgres-data:
  redis-data:
