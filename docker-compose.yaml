version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'development'
    tty: true
    stdin_open: true
    image: hub:development
    env_file: .env

  rails:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: hub-rails:development
    platform: linux/amd64
    volumes:
      - ./:/app:delegated
      - ${HUB_NODE_MODULES_DATA_PATH:-./volumes/development/node_modules}:/app/node_modules
      - ${HUB_PACKS_DATA_PATH:-./volumes/development/packs}:/app/public/packs
      - ${HUB_CACHE_DATA_PATH:-./volumes/development/cache}:/app/tmp/cache
      - ${HUB_BUNDLE_DATA_PATH:-./volumes/development/bundle}:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - webpack
      - mailhog
      - sidekiq
    ports:
      - 3000:3000
    env_file: .env
    environment:
      - WEBPACKER_DEV_SERVER_HOST=webpack
      - NODE_ENV=development
      - RAILS_ENV=development
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    image: hub-rails:development
    platform: linux/amd64
    volumes:
      - ./:/app:delegated
      - ${HUB_NODE_MODULES_DATA_PATH:-./volumes/development/node_modules}:/app/node_modules
      - ${HUB_PACKS_DATA_PATH:-./volumes/development/packs}:/app/public/packs
      - ${HUB_CACHE_DATA_PATH:-./volumes/development/cache}:/app/tmp/cache
      - ${HUB_BUNDLE_DATA_PATH:-./volumes/development/bundle}:/usr/local/bundle
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  webpack:
    <<: *base
    build:
      context: .
      dockerfile: ./docker/dockerfiles/webpack.Dockerfile
    image: hub-webpack:development
    platform: linux/amd64
    volumes:
      - ./:/app:delegated
      - ${HUB_NODE_MODULES_DATA_PATH:-./volumes/development/node_modules}:/app/node_modules
      - ${HUB_PACKS_DATA_PATH:-./volumes/development/packs}:/app/public/packs
      - ${HUB_CACHE_DATA_PATH:-./volumes/development/cache}:/app/tmp/cache
      - ${HUB_BUNDLE_DATA_PATH:-./volumes/development/bundle}:/usr/local/bundle
    ports:
      - "3035"
    environment:
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=development
      - NODE_OPTIONS=--openssl-legacy-provider
      - RAILS_ENV=development
    entrypoint: docker/entrypoints/webpack.sh
    command: bin/webpack-dev-server

  postgres:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    platform: linux/amd64
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - ${HUB_POSTGRES_DATA_PATH:-./volumes/postgres}:/data/postgres
    environment:
      - POSTGRES_DB=hub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=

  redis:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    platform: linux/amd64
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - ${HUB_REDIS_DATA_PATH:-./volumes/redis}:/data/redis
    ports:
      - '6379:6379'

  mailhog:
    image: ${HUB_MAILHOG_IMAGE:-ghcr.io/wkarts/hub-mailhog:latest}
    platform: linux/amd64
    ports:
      - 1025:1025
      - 8025:8025
