<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E10600">
  <title>HUB — Sem conexão</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; padding: 24px; }
    main { width: min(100%, 520px); text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 12px 32px rgba(15, 23, 42, .08); }
    .brand { font-size: 2rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 20px; }
    .brand span { color: #E10600; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    p { margin: 0 0 24px; line-height: 1.55; color: #475569; }
    button { appearance: none; border: 0; border-radius: 10px; background: #E10600; color: #fff; font: inherit; font-weight: 700; padding: 12px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="brand">🅷🆄<span>🅱</span></div>
    <h1>Você está sem conexão</h1>
    <p>O HUB não conseguiu acessar a rede agora. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
