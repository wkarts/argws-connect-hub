name: ${COMPOSE_PROJECT_NAME:-connec-hub-develop}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-hub-base: &hub-base
  image: ${HUB_IMAGE}
  pull_policy: always
  platform: linux/amd64
  env_file: .env
  restart: unless-stopped
  volumes:
    - ${HUB_STORAGE_DATA_PATH:-./volumes/storage}:/app/storage
  networks:
    - network-connec-hub-develop
  logging: *default-logging

services:
  migrate-connec-hub-develop:
    <<: *hub-base
    container_name: migrate-connec-hub-develop
    depends_on:
      postgres-connec-hub-develop:
        condition: service_healthy
      redis-connec-hub-develop:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - -lc
      - |
        rm -f /tmp/hub-migration-ready
        bundle exec rails db:prepare
        touch /tmp/hub-migration-ready
        exec tail -f /dev/null
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/hub-migration-ready']
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 10s

  rails-connec-hub-develop:
    <<: *hub-base
    container_name: rails-connec-hub-develop
    depends_on:
      migrate-connec-hub-develop:
        condition: service_healthy
    ports:
      - '${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-33000}:3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq-connec-hub-develop:
    <<: *hub-base
    container_name: sidekiq-connec-hub-develop
    depends_on:
      migrate-connec-hub-develop:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres-connec-hub-develop:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    container_name: postgres-connec-hub-develop
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HUB_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

  redis-connec-hub-develop:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    container_name: redis-connec-hub-develop
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - ${HUB_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

networks:
  network-connec-hub-develop:
    name: ${HUB_NETWORK_NAME:-network-connec-hub-develop}
    driver: bridge
