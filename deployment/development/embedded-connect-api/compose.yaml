name: ${COMPOSE_PROJECT_NAME:-connec-hub-develop}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-hub-base: &hub-base
  image: ${HUB_IMAGE}
  pull_policy: always
  platform: linux/amd64
  env_file: .env
  restart: unless-stopped
  volumes:
    - ${HUB_STORAGE_DATA_PATH:-./volumes/storage}:/app/storage
  networks:
    - network-connec-hub-develop
  logging: *default-logging

services:
  # ---------------------------------------------------------------------------
  # HUB-owned services
  # ---------------------------------------------------------------------------
  migrate-connec-hub-develop:
    <<: *hub-base
    container_name: migrate-connec-hub-develop
    restart: "no"
    depends_on:
      postgres-connec-hub-develop:
        condition: service_healthy
      redis-connec-hub-develop:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      CONNECT_API_BASE_URL: http://connect-api-hub-develop:8080
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:prepare']

  rails-connec-hub-develop:
    <<: *hub-base
    container_name: rails-connec-hub-develop
    depends_on:
      migrate-connec-hub-develop:
        condition: service_completed_successfully
    ports:
      - '${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-33000}:3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      CONNECT_API_BASE_URL: http://connect-api-hub-develop:8080
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq-connec-hub-develop:
    <<: *hub-base
    container_name: sidekiq-connec-hub-develop
    depends_on:
      migrate-connec-hub-develop:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      CONNECT_API_BASE_URL: http://connect-api-hub-develop:8080
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres-connec-hub-develop:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    container_name: postgres-connec-hub-develop
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HUB_POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

  redis-connec-hub-develop:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    container_name: redis-connec-hub-develop
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - ${HUB_REDIS_DATA_PATH:-./volumes/redis}:/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Connect|API services. Separate platform, colocated only by this deployment.
  # ---------------------------------------------------------------------------
  connect-api-hub-develop:
    image: ${ARGWS_CONNECT_API_IMAGE}
    container_name: connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_NAME: ${CONNECT_SERVER_NAME:-argws-connect-api}
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${CONNECT_API_PUBLIC_URL}
      SERVER_DISABLE_MANAGER: "false"
      SERVER_DISABLE_DOCS: "false"
      NODE_ENV: ${CONNECT_NODE_ENV:-PROD}
      DOCKER_ENV: "true"
      LANGUAGE: ${CONNECT_LANGUAGE:-pt-BR}
      CORS_ORIGIN: ${CONNECT_CORS_ORIGIN:-*}
      CORS_METHODS: ${CONNECT_CORS_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_CREDENTIALS: ${CONNECT_CORS_CREDENTIALS:-false}
      LOG_QRCODE: ${CONNECT_LOG_QRCODE:-true}
      QRCODE_LIMIT: ${CONNECT_QRCODE_LIMIT:-30}
      DATABASE_PROVIDER: postgresql
      DATABASE_MIGRATION_MAX_ATTEMPTS: ${CONNECT_DATABASE_MIGRATION_MAX_ATTEMPTS:-60}
      DATABASE_MIGRATION_RETRY_SECONDS: ${CONNECT_DATABASE_MIGRATION_RETRY_SECONDS:-2}
      DATABASE_CONNECTION_URI: postgresql://${CONNECT_POSTGRES_USERNAME}:${CONNECT_POSTGRES_PASSWORD}@postgres-connect-api-hub-develop:5432/${CONNECT_POSTGRES_DATABASE}?schema=public
      DATABASE_SAVE_DATA_INSTANCE: ${CONNECT_DATABASE_SAVE_DATA_INSTANCE:-true}
      DATABASE_SAVE_DATA_NEW_MESSAGE: ${CONNECT_DATABASE_SAVE_DATA_NEW_MESSAGE:-true}
      DATABASE_SAVE_MESSAGE_UPDATE: ${CONNECT_DATABASE_SAVE_MESSAGE_UPDATE:-true}
      DATABASE_SAVE_DATA_CONTACTS: ${CONNECT_DATABASE_SAVE_DATA_CONTACTS:-true}
      DATABASE_SAVE_DATA_CHATS: ${CONNECT_DATABASE_SAVE_DATA_CHATS:-true}
      DATABASE_SAVE_DATA_LABELS: ${CONNECT_DATABASE_SAVE_DATA_LABELS:-true}
      DATABASE_SAVE_DATA_HISTORIC: ${CONNECT_DATABASE_SAVE_DATA_HISTORIC:-true}
      DATABASE_SAVE_IS_ON_WHATSAPP: ${CONNECT_DATABASE_SAVE_IS_ON_WHATSAPP:-true}
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: ${CONNECT_DATABASE_SAVE_IS_ON_WHATSAPP_DAYS:-7}
      DATABASE_DELETE_MESSAGE: ${CONNECT_DATABASE_DELETE_MESSAGE:-true}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${CONNECT_REDIS_PASSWORD}@redis-connect-api-hub-develop:6379/0
      CACHE_REDIS_PREFIX_KEY: ${CONNECT_REDIS_PREFIX_KEY:-hub-connect-dev}
      CACHE_REDIS_TTL: ${CONNECT_CACHE_REDIS_TTL:-604800}
      CACHE_REDIS_SAVE_INSTANCES: ${CONNECT_CACHE_REDIS_SAVE_INSTANCES:-false}
      CACHE_LOCAL_ENABLED: ${CONNECT_CACHE_LOCAL_ENABLED:-false}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://${CONNECT_RABBITMQ_USER}:${CONNECT_RABBITMQ_PASSWORD}@rabbitmq-connect-api-hub-develop:5672/${CONNECT_RABBITMQ_VHOST}
      RABBITMQ_EXCHANGE_NAME: ${CONNECT_RABBITMQ_EXCHANGE_NAME:-hub_connect_dev}
      RABBITMQ_GLOBAL_ENABLED: ${CONNECT_RABBITMQ_GLOBAL_ENABLED:-true}
      RABBITMQ_EVENTS_CALL: "true"
      S3_ENABLED: "true"
      S3_ACCESS_KEY: ${CONNECT_MINIO_USER}
      S3_SECRET_KEY: ${CONNECT_MINIO_PASSWORD}
      S3_BUCKET: ${CONNECT_S3_BUCKET:-hub-connect-dev}
      S3_PORT: "9000"
      S3_ENDPOINT: minio-connect-api-hub-develop
      S3_REGION: ${CONNECT_S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
      S3_SKIP_POLICY: "true"
      S3_SAVE_VIDEO: ${CONNECT_S3_SAVE_VIDEO:-true}
      AUTHENTICATION_API_KEY: ${CONNECT_API_AUTH_TOKEN}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "true"
      ZAPO_VOIP_ENABLED: "true"
      ZAPO_VOIP_MAX_CONCURRENT_CALLS: ${ZAPO_VOIP_MAX_CONCURRENT_CALLS:-4}
      NATS_ENABLED: ${CONNECT_NATS_ENABLED:-false}
      NATS_URI: nats://nats-connect-api-hub-develop:4222
      NATS_EVENTS_CALL: ${CONNECT_NATS_EVENTS_CALL:-false}
      KAFKA_ENABLED: ${CONNECT_KAFKA_ENABLED:-false}
      KAFKA_BROKERS: kafka-connect-api-hub-develop:9092
      KAFKA_EVENTS_CALL: ${CONNECT_KAFKA_EVENTS_CALL:-false}
      WEBHOOK_REQUEST_TIMEOUT_MS: ${CONNECT_WEBHOOK_REQUEST_TIMEOUT_MS:-60000}
    depends_on:
      postgres-connect-api-hub-develop:
        condition: service_healthy
      redis-connect-api-hub-develop:
        condition: service_healthy
      rabbitmq-connect-api-hub-develop:
        condition: service_healthy
      minio-connect-api-hub-develop:
        condition: service_healthy
    ports:
      - '${CONNECT_API_BIND_ADDRESS:-127.0.0.1}:${CONNECT_API_PORT:-39080}:8080'
    volumes:
      - ${ARGWS_CONNECT_INSTANCES_DATA_PATH:-./volumes/connect-api/instances}:/argws-connect/instances
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 60s
    logging: *default-logging

  docs-connect-api-hub-develop:
    image: ${ARGWS_CONNECT_DOCS_IMAGE:-ghcr.io/wkarts/argws-connect-docs:develop}
    container_name: docs-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVER_URL: ${CONNECT_API_PUBLIC_URL}
    ports:
      - '${CONNECT_DOCS_BIND_ADDRESS:-127.0.0.1}:${CONNECT_DOCS_PORT:-39082}:8080'
    networks:
      - network-connec-hub-develop
    logging: *default-logging

  postgres-connect-api-hub-develop:
    image: ${ARGWS_CONNECT_POSTGRES_IMAGE:-ghcr.io/wkarts/argws-connect-postgres:15}
    container_name: postgres-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${CONNECT_POSTGRES_MAX_CONNECTIONS:-300}", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ${CONNECT_POSTGRES_DATABASE}
      POSTGRES_USER: ${CONNECT_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${CONNECT_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ${ARGWS_CONNECT_POSTGRES_DATA_PATH:-./volumes/connect-api/postgres}:/var/lib/postgresql/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CONNECT_POSTGRES_USERNAME} -d ${CONNECT_POSTGRES_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis-connect-api-hub-develop:
    image: ${ARGWS_CONNECT_REDIS_IMAGE:-ghcr.io/wkarts/argws-connect-redis:latest}
    container_name: redis-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CONNECT_REDIS_PASSWORD}
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${CONNECT_REDIS_PASSWORD}']
    volumes:
      - ${ARGWS_CONNECT_REDIS_DATA_PATH:-./volumes/connect-api/redis}:/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  rabbitmq-connect-api-hub-develop:
    image: ${ARGWS_CONNECT_RABBITMQ_IMAGE:-ghcr.io/wkarts/argws-connect-rabbitmq:management}
    container_name: rabbitmq-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_VHOST: ${CONNECT_RABBITMQ_VHOST}
      RABBITMQ_DEFAULT_USER: ${CONNECT_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${CONNECT_RABBITMQ_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_RABBITMQ_DATA_PATH:-./volumes/connect-api/rabbitmq}:/var/lib/rabbitmq
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging

  minio-connect-api-hub-develop:
    image: ${ARGWS_CONNECT_MINIO_IMAGE:-ghcr.io/wkarts/argws-connect-minio:latest}
    container_name: minio-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${CONNECT_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${CONNECT_MINIO_PASSWORD}
    volumes:
      - ${ARGWS_CONNECT_MINIO_DATA_PATH:-./volumes/connect-api/minio}:/data
    networks:
      - network-connec-hub-develop
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  nats-connect-api-hub-develop:
    profiles: ['nats', 'extended']
    image: ${ARGWS_CONNECT_NATS_IMAGE:-ghcr.io/wkarts/argws-connect-nats:2.10-alpine}
    container_name: nats-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    command: ['-js', '-m', '8222', '--store_dir', '/data']
    volumes:
      - ${ARGWS_CONNECT_NATS_DATA_PATH:-./volumes/connect-api/nats}:/data
    networks:
      - network-connec-hub-develop
    logging: *default-logging

  zookeeper-connect-api-hub-develop:
    profiles: ['kafka', 'extended']
    image: ${ARGWS_CONNECT_ZOOKEEPER_IMAGE:-ghcr.io/wkarts/argws-connect-zookeeper:7.5.0}
    container_name: zookeeper-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ${ARGWS_CONNECT_ZOOKEEPER_DATA_PATH:-./volumes/connect-api/zookeeper/data}:/var/lib/zookeeper/data
      - ${ARGWS_CONNECT_ZOOKEEPER_LOG_PATH:-./volumes/connect-api/zookeeper/log}:/var/lib/zookeeper/log
    networks:
      - network-connec-hub-develop
    logging: *default-logging

  kafka-connect-api-hub-develop:
    profiles: ['kafka', 'extended']
    image: ${ARGWS_CONNECT_KAFKA_IMAGE:-ghcr.io/wkarts/argws-connect-kafka:7.5.0}
    container_name: kafka-connect-api-hub-develop
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - zookeeper-connect-api-hub-develop
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-connect-api-hub-develop:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-connect-api-hub-develop:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - ${ARGWS_CONNECT_KAFKA_DATA_PATH:-./volumes/connect-api/kafka}:/var/lib/kafka/data
    networks:
      - network-connec-hub-develop
    logging: *default-logging

networks:
  network-connec-hub-develop:
    name: ${HUB_NETWORK_NAME:-network-connec-hub-develop}
    driver: bridge
