name: ${COMPOSE_PROJECT_NAME:-connec-hub}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-hub-base: &hub-base
  image: ${HUB_IMAGE}
  pull_policy: always
  platform: linux/amd64
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage-connec-hub:/app/storage
  networks:
    - network-connec-hub
  logging: *default-logging

services:
  migrate-connec-hub:
    <<: *hub-base
    container_name: migrate-connec-hub
    restart: "no"
    depends_on:
      postgres-connec-hub:
        condition: service_healthy
      redis-connec-hub:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 'db:prepare']

  rails-connec-hub:
    <<: *hub-base
    container_name: rails-connec-hub
    depends_on:
      migrate-connec-hub:
        condition: service_completed_successfully
    ports:
      - '${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq-connec-hub:
    <<: *hub-base
    container_name: sidekiq-connec-hub
    depends_on:
      migrate-connec-hub:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres-connec-hub:
    # Pinned to the official public image. This intentionally ignores legacy
    # HUB_POSTGRES_IMAGE values left in existing .env files.
    image: postgres:16-alpine
    container_name: postgres-connec-hub
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data-connec-hub:/var/lib/postgresql/data
    networks:
      - network-connec-hub
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

  redis-connec-hub:
    # Pinned to the official public image. This intentionally ignores legacy
    # HUB_REDIS_IMAGE values left in existing .env files.
    image: redis:7-alpine
    container_name: redis-connec-hub
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data-connec-hub:/data
    networks:
      - network-connec-hub
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

volumes:
  storage-connec-hub:
    name: ${HUB_STORAGE_VOLUME_NAME:-storage-connec-hub}
  postgres-data-connec-hub:
    name: ${HUB_POSTGRES_VOLUME_NAME:-postgres-data-connec-hub}
  redis-data-connec-hub:
    name: ${HUB_REDIS_VOLUME_NAME:-redis-data-connec-hub}

networks:
  network-connec-hub:
    name: ${HUB_NETWORK_NAME:-network-connec-hub}
    driver: bridge
