# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed At 12:00 on every day-of-month.
internal_check_new_versions_job:
  cron: '0 12 */1 * *'
  class: 'Internal::CheckNewVersionsJob'
  queue: scheduled_jobs

# Recovery scanner for scheduled campaigns and other scheduled items.
# Campaigns also enqueue an exact delayed job when their schedule is saved.
trigger_scheduled_items_job:
  cron: '*/1 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# Validate and repair the Meta-compatible realtime webhook automatically.
# The service is idempotent: it only writes when the remote webhook diverges.
connect_api_realtime_repair_scheduler_job:
  cron: '*/2 * * * *'
  class: 'Channels::Whatsapp::ConnectApiRealtimeRepairSchedulerJob'
  queue: low

# Connect|API reliability recovery runs every minute. Besides the pre-existing
# media recovery, it now also catches recent text/status events persisted while
# HUB was temporarily unavailable. source_id deduplication prevents re-sends.
connect_api_media_sync_scheduler_job:
  cron: '*/1 * * * *'
  class: 'Channels::Whatsapp::ConnectApiMediaSyncSchedulerJob'
  queue: low

# Backfill WhatsApp profile pictures without depending on the Meta-compatible
# webhook to carry profile.picture.
connect_api_profile_picture_scheduler_job:
  cron: '*/1 * * * *'
  class: 'Channels::Whatsapp::ConnectApiProfilePictureSchedulerJob'
  queue: low

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs
