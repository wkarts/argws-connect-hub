name: Release - Publish Versioned Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: argws-connect-hub-release-main
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize release source
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Require merged develop to main PR
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Manual release dispatch authorized."
            exit 0
          fi

          prs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          release_pr="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "develop")][0] // empty' <<<"$prs")"

          if [[ -z "$release_pr" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "This main push did not come from a merged develop -> main PR; release publication is disabled."
            exit 0
          fi

          title="$(jq -r '.title // ""' <<<"$release_pr")"
          if [[ "$title" == *"[skip release]"* ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Release PR requested [skip release]."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Release authorized from merged develop -> main PR."

  validate:
    name: Validate release source - no image build
    needs: gate
    if: ${{ needs.gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Ruby 3.3.10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: false

      - name: Install Node for release tooling
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate canonical version metadata
        run: bash ./scripts/validate-version-sync.sh

      - name: Validate HUB source and deployments
        run: bash ./scripts/validate-hub-ci.sh

      - name: Test image publication verification
        run: bash ./scripts/test-verify-hub-image.sh

  plan:
    name: Validate declared release version
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout validated release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release version and tag availability
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-version-sync.sh
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must be SemVer X.Y.Z; got '$version'." >&2
            exit 1
          }

          git fetch --tags --force
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists; bump VERSION in develop before the release PR." >&2
            exit 1
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [[ -n "$latest" ]]; then
            latest_version="${latest#v}"
            highest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n1)"
            if [[ "$version" == "$latest_version" || "$highest" != "$version" ]]; then
              echo "Declared VERSION $version must be greater than latest release $latest_version." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release source declares HUB ${tag}."

  preflight:
    name: Preflight tag and release
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate annotated-tag creation before image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag='${{ needs.plan.outputs.tag }}'
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} appeared while release was being prepared." >&2
            exit 1
          fi
          probe="__hub-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$probe" "$GITHUB_SHA" -m "HUB release preflight"
          git tag -d "$probe" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null

  build:
    name: Build and publish immutable release image
    needs: [plan, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable HUB bases
        id: bases
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < docker/base/VERSION)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$base_version" >> "$GITHUB_OUTPUT"
          echo "deps=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-deps-base:${base_version}" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-runtime-base:${base_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for immutable HUB bases
        shell: bash
        env:
          DEPS_BASE: ${{ steps.bases.outputs.deps }}
          RUNTIME_BASE: ${{ steps.bases.outputs.runtime }}
        run: |
          set -euo pipefail
          for image in "$DEPS_BASE" "$RUNTIME_BASE"; do
            ready=false
            for attempt in $(seq 1 180); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                ready=true
                break
              fi
              echo "Waiting for $image ($attempt/180)..."
              sleep 10
            done
            [[ "$ready" == true ]] || {
              echo "Required immutable HUB base is unavailable: $image" >&2
              exit 1
            }
          done

      - name: Resolve release image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          major="${v%%.*}"
          rest="${v#*.}"
          minor="${rest%%.*}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${v}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${major}.${minor}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${major}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:latest"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build once and publish release image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            HUB_VERSION=${{ needs.plan.outputs.version }}
            HUB_DEPS_BASE_IMAGE=${{ steps.bases.outputs.deps }}
            HUB_RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.runtime }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.channel=stable
            org.argws.hub.base.version=${{ steps.bases.outputs.version }}
          cache-from: type=gha,scope=hub-release-amd64
          cache-to: type=gha,mode=max,scope=hub-release-amd64
          provenance: true
          sbom: true

      - name: Verify final versioned image and latest
        timeout-minutes: 15
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/argws-connect-hub
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_CHANNEL: stable
          HUB_IMAGE_REQUIRE_ANONYMOUS_PULL: ${{ vars.HUB_IMAGE_REQUIRE_ANONYMOUS_PULL || 'true' }}
        run: bash ./scripts/verify-hub-image.sh

  release:
    name: Tag and publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable tag and GitHub Release idempotently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing="$(git rev-list -n1 "$TAG")"
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "Tag $TAG already points to $existing, expected $RELEASE_SHA." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" "$RELEASE_SHA" -m "HUB $TAG"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; keeping it."
          else
            release_header="$(printf 'Image: ghcr.io/%s/argws-connect-hub:%s\nDigest: %s' '${{ github.repository_owner }}' '${{ needs.plan.outputs.version }}' "$IMAGE_DIGEST")"
            gh release create "$TAG" \
              --target "$RELEASE_SHA" \
              --title "HUB $TAG" \
              --generate-notes \
              --notes "$release_header"
          fi
