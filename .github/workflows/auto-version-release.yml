name: Release - Auto Version, Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: Optional bump override
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: argws-connect-hub-release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source - no image build
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Ruby 3.3.10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: false

      - name: Install Node for release tooling
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate HUB source and deployments
        run: bash ./scripts/validate-hub-ci.sh

  plan:
    name: Plan semantic version
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Resolve merged PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          echo "title=$(jq -r '.[0].title // empty' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r '[.[0].labels[]?.name] | join(",")' <<<"$json")" >> "$GITHUB_OUTPUT"

      - name: Compute and validate next version before any image build
        id: plan
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          TITLE: ${{ steps.pr.outputs.title }}
          FORCE: ${{ inputs.force_bump || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          labels="$LABELS"
          [[ "$FORCE" == auto || -z "$FORCE" ]] || labels="version:$FORCE"
          result="$(node .github/scripts/compute-next-version.mjs "$latest" "$labels" "$TITLE")"
          version="$(jq -r .version <<<"$result")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version planner returned invalid SemVer: $version" >&2
            exit 1
          }
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists; refusing to build a duplicate release." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Planned HUB ${tag}; versioning is valid before image construction."

  version-source:
    name: Materialize release version
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Configure Git identity before any generated commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure main still points to the validated source
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main moved while release was being planned ($current != $GITHUB_SHA)." >&2
            exit 1
          fi

      - name: Apply and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-version.mjs "${{ needs.plan.outputs.version }}"
          expected='${{ needs.plan.outputs.version }}'
          [[ "$(tr -d '[:space:]' < VERSION)" == "$expected" ]]
          bash ./scripts/validate-version-sync.sh
          node - "$expected" <<'NODE'
          const fs = require('fs');
          const expected = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('RELEASE-MANIFEST.json', 'utf8'));
          if (pkg.version !== expected) throw new Error(`package.json version ${pkg.version} != ${expected}`);
          if (manifest.version !== expected) throw new Error(`RELEASE-MANIFEST version ${manifest.version} != ${expected}`);
          NODE
          git diff --check

      - name: Persist version metadata before expensive build
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION package.json RELEASE-MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ needs.plan.outputs.version }} [skip release]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight tag and release
    needs: [plan, version-source]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact versioned source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.sha }}
          fetch-depth: 0

      - name: Configure Git identity in tag-capable job
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate annotated-tag creation before image build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag='${{ needs.plan.outputs.tag }}'
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} appeared while release was being prepared." >&2
            exit 1
          fi
          probe="__hub-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$probe" "${{ needs.version-source.outputs.sha }}" -m "HUB release preflight"
          git tag -d "$probe" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null
          echo "Git identity, target tag and GitHub token preflight: OK"

  build:
    name: Build and publish immutable release image
    needs: [plan, version-source, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact versioned source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.sha }}
          fetch-depth: 0

      - name: Resolve immutable HUB bases
        id: bases
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < docker/base/VERSION)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$base_version" >> "$GITHUB_OUTPUT"
          echo "deps=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-deps-base:${base_version}" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-runtime-base:${base_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for immutable HUB bases
        shell: bash
        env:
          DEPS_BASE: ${{ steps.bases.outputs.deps }}
          RUNTIME_BASE: ${{ steps.bases.outputs.runtime }}
        run: |
          set -euo pipefail
          for image in "$DEPS_BASE" "$RUNTIME_BASE"; do
            ready=false
            for attempt in $(seq 1 180); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                ready=true
                break
              fi
              echo "Waiting for $image ($attempt/180)..."
              sleep 10
            done
            [[ "$ready" == true ]] || {
              echo "Required immutable HUB base is unavailable: $image" >&2
              exit 1
            }
          done

      - name: Resolve release image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          major="${v%%.*}"
          rest="${v#*.}"
          minor="${rest%%.*}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${v}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${major}.${minor}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:${major}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:latest"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ needs.version-source.outputs.sha }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build once and publish release image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ needs.version-source.outputs.sha }}
            HUB_VERSION=${{ needs.plan.outputs.version }}
            HUB_DEPS_BASE_IMAGE=${{ steps.bases.outputs.deps }}
            HUB_RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.runtime }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version-source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.channel=stable
            org.argws.hub.base.version=${{ steps.bases.outputs.version }}
          cache-from: type=gha,scope=hub-release-amd64
          cache-to: type=gha,mode=max,scope=hub-release-amd64
          provenance: true
          sbom: true

  release:
    name: Tag and publish GitHub Release
    needs: [plan, version-source, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-source.outputs.sha }}
          fetch-depth: 0

      - name: Configure Git identity in the actual tag job
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable tag and GitHub Release idempotently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.version-source.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            existing="$(git rev-list -n1 "$TAG")"
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "Tag $TAG already points to $existing, expected $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already exists on the expected SHA; keeping it."
          else
            git tag -a "$TAG" "$RELEASE_SHA" -m "HUB $TAG"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; keeping it."
          else
            release_header="$(printf 'Image: ghcr.io/%s/argws-connect-hub:%s\nDigest: %s' '${{ github.repository_owner }}' '${{ needs.plan.outputs.version }}' "$IMAGE_DIGEST")"
            gh release create "$TAG" \
              --target "$RELEASE_SHA" \
              --title "HUB $TAG" \
              --generate-notes \
              --notes "$release_header"
          fi
