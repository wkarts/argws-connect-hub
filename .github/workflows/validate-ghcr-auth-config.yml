name: Validate GHCR Deployment Auth

on:
  pull_request:
    paths:
      - 'scripts/configure-ghcr-auth.sh'
      - 'scripts/test-configure-ghcr-auth.sh'
      - 'deployment/GHCR-AUTH.md'
      - '.github/workflows/validate-ghcr-auth-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate scripts without credentials
        run: bash ./scripts/test-configure-ghcr-auth.sh
