name: GHCR - Publish Development Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argws-connect-hub-develop-image
  cancel-in-progress: true

jobs:
  validate:
    name: Validate develop source - no image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Guard develop channel
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/develop" ]] || {
            echo "Development publisher accepts only refs/heads/develop (got ${GITHUB_REF})." >&2
            exit 1
          }

      - name: Checkout exact develop revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Ruby 3.3.10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: false

      - name: Install Node for release-script syntax
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate source and deployments
        run: bash ./scripts/validate-hub-ci.sh

      - name: Test image publication verification
        run: bash ./scripts/test-verify-hub-image.sh

  build:
    name: Build and publish HUB develop / amd64
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve application and base versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(tr -d '[:space:]' < VERSION)"
          base_version="$(tr -d '[:space:]' < docker/base/VERSION)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must be SemVer X.Y.Z, got: $app_version" >&2
            exit 1
          }
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          short_sha="${GITHUB_SHA:0:12}"
          develop_version="${app_version}-develop.${short_sha}"
          echo "app=$app_version" >> "$GITHUB_OUTPUT"
          echo "develop=$develop_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "base=$base_version" >> "$GITHUB_OUTPUT"
          echo "deps_base=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-deps-base:${base_version}" >> "$GITHUB_OUTPUT"
          echo "runtime_base=ghcr.io/${{ github.repository_owner }}/argws-connect-hub-runtime-base:${base_version}" >> "$GITHUB_OUTPUT"
          echo "Develop build version: $develop_version"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for immutable HUB bases
        shell: bash
        env:
          DEPS_BASE: ${{ steps.versions.outputs.deps_base }}
          RUNTIME_BASE: ${{ steps.versions.outputs.runtime_base }}
        run: |
          set -euo pipefail
          for image in "$DEPS_BASE" "$RUNTIME_BASE"; do
            ready=false
            for attempt in $(seq 1 180); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                ready=true
                break
              fi
              echo "Waiting for $image ($attempt/180)..."
              sleep 10
            done
            [[ "$ready" == true ]] || {
              echo "Required immutable HUB base is unavailable: $image" >&2
              exit 1
            }
          done

      - name: Build and publish develop image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            HUB_VERSION=${{ steps.versions.outputs.develop }}
            HUB_DEPS_BASE_IMAGE=${{ steps.versions.outputs.deps_base }}
            HUB_RUNTIME_BASE_IMAGE=${{ steps.versions.outputs.runtime_base }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop-${{ steps.versions.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ steps.versions.outputs.develop }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.channel=develop
            org.argws.hub.base.version=${{ steps.versions.outputs.base }}
          cache-from: type=gha,scope=hub-develop-amd64
          cache-to: type=gha,mode=max,scope=hub-develop-amd64
          provenance: true
          sbom: true

      - name: Verify final develop image
        timeout-minutes: 15
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/argws-connect-hub
          IMAGE_TAGS: |
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop-${{ steps.versions.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.versions.outputs.develop }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_CHANNEL: develop
          HUB_IMAGE_REQUIRE_ANONYMOUS_PULL: ${{ vars.HUB_IMAGE_REQUIRE_ANONYMOUS_PULL || 'false' }}
        run: bash ./scripts/verify-hub-image.sh
