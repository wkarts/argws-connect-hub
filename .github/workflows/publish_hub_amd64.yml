name: GHCR - Publish Development Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argws-connect-hub-develop-image
  cancel-in-progress: true

jobs:
  build:
    name: Build HUB develop / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
      - name: Audit HUB
        run: bash ./scripts/audit-hub.sh
      - name: Resolve version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish develop image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ steps.version.outputs.value }}-develop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=hub-develop-amd64
          cache-to: type=gha,mode=max,scope=hub-develop-amd64
          provenance: true
          sbom: true
