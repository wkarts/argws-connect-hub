name: GHCR - Publish Development Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argws-connect-hub-develop-image
  cancel-in-progress: true

jobs:
  guard:
    name: Guard develop channel
    runs-on: ubuntu-latest
    steps:
      - name: Refuse execution outside develop
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/develop" ]]; then
            echo "This workflow publishes only from refs/heads/develop (got ${GITHUB_REF})." >&2
            exit 1
          fi

  build:
    name: Build HUB develop / amd64
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify checked out branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "develop" ]]

      - name: Audit HUB
        run: bash ./scripts/audit-hub.sh

      - name: Resolve version metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:develop
            ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}-develop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=hub-develop-amd64
          cache-to: type=gha,mode=max,scope=hub-develop-amd64
          provenance: true
          sbom: true
