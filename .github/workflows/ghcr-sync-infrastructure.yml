name: GHCR - Verify HUB Infrastructure Images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: read

concurrency:
  group: argws-connect-hub-infrastructure-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify required AMD64 GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify runtime/build dependencies are available only in GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          skopeo inspect --override-arch amd64 docker://ghcr.io/${OWNER}/hub-ruby:3.3.8-alpine3.19 >/dev/null
          skopeo inspect --override-arch amd64 docker://ghcr.io/${OWNER}/hub-postgres:16-alpine >/dev/null
          skopeo inspect --override-arch amd64 docker://ghcr.io/${OWNER}/hub-redis:7-alpine >/dev/null
          echo "Required HUB infrastructure images are available in GHCR."
