name: HUB Quality

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit product/privacy/deploy
        run: bash ./scripts/audit-hub.sh
      - name: Ruby syntax
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/wkarts/hub-ruby:3.3.8-alpine3.19 \
            sh -lc "find app config lib db/migrate -type f -name '*.rb' -print0 | xargs -0 -n1 ruby -c >/dev/null"
