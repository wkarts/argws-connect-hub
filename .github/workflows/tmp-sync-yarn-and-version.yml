name: TEMP - Sync Yarn Lock and Version

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/tmp-sync-yarn-and-version.yml'

permissions:
  contents: write

concurrency:
  group: hub-temp-sync-yarn-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Yarn 1.22.22
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Repair qrcode-generator lock entry
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^qrcode-generator@1.4.4:' yarn.lock; then
            cat >> yarn.lock <<'EOF'

qrcode-generator@1.4.4:
  version "1.4.4"
  resolved "https://registry.yarnpkg.com/qrcode-generator/-/qrcode-generator-1.4.4.tgz#63f771224854759329a99048806a53ed278740e7"
  integrity sha512-HM7yY8O2ilqhmULxGMpcHSF1EhJJ9yBj8gvDEuZ6M+KGJ0YY2hKpnXvRD+hZPLrDVck3ExIGhmPtSdcjC+guuw==
EOF
          fi

      - name: Validate frozen Yarn lockfile
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-scripts --non-interactive --network-concurrency 1 --network-timeout 600000

      - name: Prepare next release 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          printf '1.1.3\n' > VERSION
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.1.3';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const manifest = JSON.parse(fs.readFileSync('RELEASE-MANIFEST.json', 'utf8'));
          manifest.version = '1.1.3';
          manifest.revision_date = '2026-09-13';
          fs.writeFileSync('RELEASE-MANIFEST.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Commit synchronized state and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-sync-yarn-and-version.yml
          git add yarn.lock VERSION package.json RELEASE-MANIFEST.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore(release): sync yarn lock and prepare 1.1.3'
          git push origin HEAD:develop
