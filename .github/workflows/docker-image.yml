name: Validate HUB Containers - No Image Build

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static, deployment and container definition checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Ruby 3.3.10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: false

      - name: Install Node for release-script syntax
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate HUB without building an image
        run: bash ./scripts/validate-hub-ci.sh

      - name: Assert PR validation does not invoke Docker image builds
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*uses:[[:space:]]+docker/build-push-action@' .github/workflows/docker-image.yml; then
            echo 'PR container validation must not build a disposable Docker image.' >&2
            exit 1
          fi
