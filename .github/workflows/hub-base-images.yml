name: GHCR - HUB Content-Addressed Base Images

on:
  push:
    branches: [develop]
    paths:
      - 'docker/base/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'yarn.lock'
      - 'packages/**'
      - 'scripts/resolve-hub-base-refs.sh'
      - '.github/workflows/hub-base-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argws-connect-hub-base-images
  cancel-in-progress: false

jobs:
  os-bases:
    name: Publish HUB ${{ matrix.kind }} base / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: build
            dockerfile: docker/base/build/Dockerfile
            image_name: argws-connect-hub-build-base
          - kind: runtime
            dockerfile: docker/base/runtime/Dockerfile
            image_name: argws-connect-hub-runtime-base

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve content-addressed base identities
        id: identities
        env:
          HUB_GHCR_OWNER: ${{ github.repository_owner }}
        run: bash ./scripts/resolve-hub-base-refs.sh --github-output

      - name: Select matrix base identity
        id: base
        env:
          KIND: ${{ matrix.kind }}
          BUILD_SHA: ${{ steps.identities.outputs.build_definition_sha }}
          BUILD_IMAGE: ${{ steps.identities.outputs.build_image }}
          BUILD_LATEST: ${{ steps.identities.outputs.build_latest }}
          RUNTIME_SHA: ${{ steps.identities.outputs.runtime_definition_sha }}
          RUNTIME_IMAGE: ${{ steps.identities.outputs.runtime_image }}
          RUNTIME_LATEST: ${{ steps.identities.outputs.runtime_latest }}
        shell: bash
        run: |
          set -euo pipefail
          case "$KIND" in
            build)
              echo "definition_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
              echo "image=$BUILD_IMAGE" >> "$GITHUB_OUTPUT"
              echo "latest=$BUILD_LATEST" >> "$GITHUB_OUTPUT"
              ;;
            runtime)
              echo "definition_sha=$RUNTIME_SHA" >> "$GITHUB_OUTPUT"
              echo "image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"
              echo "latest=$RUNTIME_LATEST" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported base kind: $KIND" >&2
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable content-addressed base
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.base.outputs.image }}
          EXPECTED: ${{ steps.base.outputs.definition_sha }}
        run: |
          set -euo pipefail
          if docker pull "$IMAGE" >/dev/null 2>&1; then
            actual="$(docker inspect --format '{{ index .Config.Labels "org.argws.hub.base.definition-sha" }}' "$IMAGE")"
            [[ "$actual" == "$EXPECTED" ]] || {
              echo "Content-addressed base $IMAGE exists with an invalid definition label." >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish content-addressed base
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base.outputs.image }}
          build-args: |
            BASE_DEFINITION_SHA=${{ steps.base.outputs.definition_sha }}
          labels: |
            org.opencontainers.image.title=HUB ${{ matrix.kind }} base
            org.opencontainers.image.version=def-${{ steps.base.outputs.definition_sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.base.kind=${{ matrix.kind }}
            org.argws.hub.base.definition-sha=${{ steps.base.outputs.definition_sha }}
          cache-from: type=gha,scope=hub-base-${{ matrix.kind }}-amd64
          cache-to: type=gha,mode=max,scope=hub-base-${{ matrix.kind }}-amd64
          provenance: true
          sbom: true

      - name: Point latest to exact content-addressed base
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag '${{ steps.base.outputs.latest }}' \
            '${{ steps.base.outputs.image }}'
          docker buildx imagetools inspect '${{ steps.base.outputs.latest }}' >/dev/null

  deps-base:
    name: Publish HUB dependency base / amd64
    needs: os-bases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve content-addressed dependency identity
        id: identities
        env:
          HUB_GHCR_OWNER: ${{ github.repository_owner }}
        run: bash ./scripts/resolve-hub-base-refs.sh --github-output

      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for exact content-addressed build base
        shell: bash
        env:
          BUILD_BASE: ${{ steps.identities.outputs.build_image }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            docker buildx imagetools inspect "$BUILD_BASE" >/dev/null 2>&1 && exit 0
            echo "Waiting for $BUILD_BASE ($attempt/60)..."
            sleep 10
          done
          echo "Required build base unavailable: $BUILD_BASE" >&2
          exit 1

      - name: Check immutable content-addressed dependency base
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.identities.outputs.deps_image }}
          EXPECTED: ${{ steps.identities.outputs.deps_definition_sha }}
        run: |
          set -euo pipefail
          if docker pull "$IMAGE" >/dev/null 2>&1; then
            actual="$(docker inspect --format '{{ index .Config.Labels "org.argws.hub.base.definition-sha" }}' "$IMAGE")"
            [[ "$actual" == "$EXPECTED" ]] || {
              echo "Content-addressed dependency base $IMAGE exists with an invalid definition label." >&2
              exit 1
            }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish content-addressed dependency base
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/base/deps/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identities.outputs.deps_image }}
          build-args: |
            HUB_BUILD_BASE_IMAGE=${{ steps.identities.outputs.build_image }}
            BASE_DEFINITION_SHA=${{ steps.identities.outputs.deps_definition_sha }}
          labels: |
            org.opencontainers.image.title=HUB dependency base
            org.opencontainers.image.version=def-${{ steps.identities.outputs.deps_definition_sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.base.kind=deps
            org.argws.hub.base.definition-sha=${{ steps.identities.outputs.deps_definition_sha }}
          cache-from: type=gha,scope=hub-base-deps-amd64
          cache-to: type=gha,mode=max,scope=hub-base-deps-amd64
          provenance: true
          sbom: true

      - name: Point latest to exact content-addressed dependency base
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag '${{ steps.identities.outputs.deps_latest }}' \
            '${{ steps.identities.outputs.deps_image }}'
          docker buildx imagetools inspect '${{ steps.identities.outputs.deps_latest }}' >/dev/null
