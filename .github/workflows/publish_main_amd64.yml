name: GHCR - Publish Stable Main Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: argws-connect-hub-main-image
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize stable main publication
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Require main or merged develop to main PR
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_NAME" == "refs/heads/main" ]] || {
              echo "Manual stable publication accepts only refs/heads/main (got $REF_NAME)." >&2
              exit 1
            }
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Manual stable main publication authorized."
            exit 0
          fi

          prs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')"
          promotion_pr="$(jq -c '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "develop")][0] // empty' <<<"$prs")"

          if [[ -z "$promotion_pr" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "This main push did not come from a merged develop -> main PR; stable publication is disabled."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Stable main publication authorized from merged develop -> main PR."

  validate:
    name: Validate exact main source - no image build
    needs: gate
    if: ${{ needs.gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Ruby 3.3.10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: false

      - name: Install Node for validation tooling
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate canonical source metadata
        run: bash ./scripts/validate-version-sync.sh

      - name: Validate HUB source and deployments
        run: bash ./scripts/validate-hub-ci.sh

      - name: Test image publication verification
        run: bash ./scripts/test-verify-hub-image.sh

  publish:
    name: Publish idempotent stable HUB main / amd64
    needs: [gate, validate]
    if: ${{ needs.gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve content-addressed bases and stable build identity
        id: identity
        env:
          HUB_GHCR_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          main_version="main-${short_sha}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "main_version=$main_version" >> "$GITHUB_OUTPUT"
          bash ./scripts/resolve-hub-base-refs.sh --github-output
          echo "Stable main build identity: $main_version"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for immutable HUB bases
        shell: bash
        env:
          DEPS_BASE: ${{ steps.identity.outputs.deps_image }}
          RUNTIME_BASE: ${{ steps.identity.outputs.runtime_image }}
        run: |
          set -euo pipefail
          for image in "$DEPS_BASE" "$RUNTIME_BASE"; do
            ready=false
            for attempt in $(seq 1 180); do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                ready=true
                break
              fi
              echo "Waiting for $image ($attempt/180)..."
              sleep 10
            done
            [[ "$ready" == true ]] || {
              echo "Required immutable HUB base is unavailable: $image" >&2
              exit 1
            }
          done

      - name: Resolve stable image aliases
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:main"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:latest"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:main-${{ steps.identity.outputs.short_sha }}"
            echo "ghcr.io/${{ github.repository_owner }}/argws-connect-hub:sha-${{ github.sha }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Resolve existing stable SHA image
        id: existing
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/argws-connect-hub
          SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE_REPOSITORY}:main-${SHORT_SHA}"
          manifest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' 2>/dev/null || true)"
          digest="$(jq -er '.digest | select(type == "string")' <<<"$manifest" 2>/dev/null || true)"

          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Stable immutable alias already exists: $candidate@$digest"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing stable immutable alias for this main SHA; one build is required."
          fi

      - name: Build once and publish stable main image
        if: ${{ steps.existing.outputs.exists != 'true' }}
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            HUB_VERSION=${{ steps.identity.outputs.main_version }}
            HUB_DEPS_BASE_IMAGE=${{ steps.identity.outputs.deps_image }}
            HUB_RUNTIME_BASE_IMAGE=${{ steps.identity.outputs.runtime_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HUB
            org.opencontainers.image.version=${{ steps.identity.outputs.main_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.argws.hub.channel=stable
            org.argws.hub.base.deps.definition-sha=${{ steps.identity.outputs.deps_definition_sha }}
            org.argws.hub.base.runtime.definition-sha=${{ steps.identity.outputs.runtime_definition_sha }}
          cache-from: type=gha,scope=hub-main-amd64
          cache-to: type=gha,mode=max,scope=hub-main-amd64
          provenance: true
          sbom: true

      - name: Reapply moving aliases from existing immutable stable image
        if: ${{ steps.existing.outputs.exists == 'true' }}
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/argws-connect-hub
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$IMAGE_TAGS" | sed '/^[[:space:]]*$/d')
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "${IMAGE_REPOSITORY}@${EXISTING_DIGEST}"
          echo "Stable aliases converged without rebuilding the already-published main SHA."

      - name: Resolve final stable digest
        id: final
        env:
          EXISTING: ${{ steps.existing.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXISTING" == "true" ]]; then
            digest="$EXISTING_DIGEST"
          else
            digest="$BUILD_DIGEST"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid final stable digest: $digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify final stable main aliases
        timeout-minutes: 15
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/argws-connect-hub
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_DIGEST: ${{ steps.final.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.main_version }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_CHANNEL: stable
          HUB_IMAGE_REQUIRE_ANONYMOUS_PULL: ${{ vars.HUB_IMAGE_REQUIRE_ANONYMOUS_PULL || 'true' }}
        run: bash ./scripts/verify-hub-image.sh

      - name: Cleanup old GHCR images and build caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: argws-connect-hub
          CACHE_RETENTION_HOURS: '2'
        run: bash ./scripts/cleanup-github-storage.sh all
