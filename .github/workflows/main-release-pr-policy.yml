name: Main Release PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-policy:
    name: Validate develop to main release flow
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the only source branch for main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "main" ]] || { echo "Release PR base must be main." >&2; exit 1; }
          [[ "$HEAD_REF" == "develop" ]] || { echo "main only accepts release PRs from develop; got '$HEAD_REF'." >&2; exit 1; }

      - name: Checkout proposed develop revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Validate source and release-flow invariants
        run: |
          bash ./scripts/validate-hub-ci.sh
          node ./scripts/test-release-versioning.mjs

      - name: Preview automatic semantic release
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          result="$(node .github/scripts/compute-next-version.mjs "$latest" "$LABELS" "$TITLE" auto)"
          echo "Release preview: $(jq -r '.version + " (" + .bump + ")"' <<<"$result")"
