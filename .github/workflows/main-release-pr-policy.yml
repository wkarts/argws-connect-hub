name: Main Promotion PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  promotion-policy:
    name: Validate idempotent develop to main promotion
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the only source branch for main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "main" ]] || {
            echo "Promotion PR base must be main." >&2
            exit 1
          }
          [[ "$HEAD_REF" == "develop" ]] || {
            echo "main only accepts promotion PRs from develop; got '$HEAD_REF'." >&2
            exit 1
          }

      - name: Checkout proposed develop revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate source and promotion-flow invariants
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-hub-ci.sh
          bash ./scripts/validate-release-flow.sh

      - name: Validate source metadata for idempotent promotion
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-version-sync.sh
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION metadata must be SemVer X.Y.Z; got '$version'." >&2
            exit 1
          }

          echo "Promotion candidate validated. VERSION=$version is source metadata only."
          echo "Existing SemVer tags do not block develop -> main promotion."
