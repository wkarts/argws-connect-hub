name: Main Release PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-policy:
    name: Validate develop to main release flow
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the only source branch for main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "main" ]] || {
            echo "Release PR base must be main." >&2
            exit 1
          }
          [[ "$HEAD_REF" == "develop" ]] || {
            echo "main only accepts release PRs from develop; got '$HEAD_REF'." >&2
            exit 1
          }

      - name: Checkout proposed develop revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate source and release-flow invariants
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-hub-ci.sh
          bash ./scripts/validate-release-flow.sh

      - name: Require a new declared SemVer release
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-version-sync.sh
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must be SemVer X.Y.Z; got '$version'." >&2
            exit 1
          }

          git fetch --tags --force
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists; develop must declare the next release before promotion to main." >&2
            exit 1
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [[ -n "$latest" ]]; then
            latest_version="${latest#v}"
            highest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n1)"
            if [[ "$version" == "$latest_version" || "$highest" != "$version" ]]; then
              echo "Develop VERSION $version must be greater than current release $latest_version." >&2
              exit 1
            fi
          fi

          echo "Release candidate validated: v${version}"
