name: Main Promotion PR Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  promotion-policy:
    name: Validate develop to main promotion flow
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the only source branch for main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "main" ]] || {
            echo "Promotion PR base must be main." >&2
            exit 1
          }
          [[ "$HEAD_REF" == "develop" ]] || {
            echo "main only accepts promotion PRs from develop; got '$HEAD_REF'." >&2
            exit 1
          }

      - name: Checkout proposed develop revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate source and release-flow invariants
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/validate-hub-ci.sh
          bash ./scripts/validate-release-flow.sh
