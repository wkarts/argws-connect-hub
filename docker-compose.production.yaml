name: ${COMPOSE_PROJECT_NAME:-hub}

x-hub-base: &hub-base
  image: ${HUB_IMAGE:-ghcr.io/wkarts/argws-connect-hub:latest}
  pull_policy: always
  platform: linux/amd64
  env_file: .env
  restart: unless-stopped
  volumes:
    - hub_storage:/app/storage

services:
  rails:
    <<: *hub-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *hub-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: ${HUB_POSTGRES_IMAGE:-ghcr.io/wkarts/hub-postgres:16-alpine}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-hub_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
    volumes:
      - hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-hub} -d ${POSTGRES_DATABASE:-hub_production}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${HUB_REDIS_IMAGE:-ghcr.io/wkarts/hub-redis:7-alpine}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - hub_redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hub_storage:
  hub_postgres:
  hub_redis:
